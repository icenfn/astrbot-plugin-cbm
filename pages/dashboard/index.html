<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codebase Memory MCP 控制面板</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="cbm-shell">
      <header class="cbm-header">
        <div class="cbm-brand">
          <div class="cbm-logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="30" height="30">
              <defs>
                <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#5b8def" />
                  <stop offset="1" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
              <g fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round">
                <path d="M14 16h20M14 24h20M14 32h20" />
                <circle cx="24" cy="16" r="3.4" fill="url(#g)" stroke="none" />
                <circle cx="16" cy="24" r="3.4" fill="url(#g)" stroke="none" />
                <circle cx="32" cy="24" r="3.4" fill="url(#g)" stroke="none" />
                <circle cx="24" cy="32" r="3.4" fill="url(#g)" stroke="none" />
              </g>
            </svg>
          </div>
          <div>
            <h1>Codebase Memory MCP</h1>
            <p class="cbm-sub" id="subtitle">加载中…</p>
          </div>
        </div>
        <div class="cbm-header-actions">
          <span class="cbm-pill" id="run-pill"><i class="dot"></i><span id="run-pill-text">未知</span></span>
          <button class="cbm-btn ghost" id="btn-refresh" title="刷新">↻ 刷新</button>
        </div>
      </header>

      <div class="cbm-runbar" id="cbm-runbar">
        <button class="cbm-btn primary" id="btn-start">▶ 启动</button>
        <button class="cbm-btn" id="btn-stop">■ 停止</button>
        <button class="cbm-btn" id="btn-restart">⟳ 重启</button>
      </div>

      <nav class="cbm-tabs" id="cbm-tabs" role="tablist">
        <button class="cbm-tab active" data-tab="overview" role="tab">概览</button>
        <button class="cbm-tab" data-tab="install" role="tab">安装</button>
        <button class="cbm-tab" data-tab="mcp" role="tab">MCP 接入</button>
        <button class="cbm-tab" data-tab="logs" role="tab">日志</button>
      </nav>

      <main class="cbm-panels">
        <!-- 概览 -->
        <section class="cbm-panel active" data-panel="overview">
          <div class="cbm-grid">
            <section class="cbm-card span-2">
              <div class="cbm-card-head">
                <h2>运行状态</h2>
                <span class="cbm-tag" id="variant-tag">—</span>
              </div>
              <div class="cbm-status-grid">
                <div class="stat"><label>状态</label><value id="st-state">—</value></div>
                <div class="stat"><label>版本</label><value id="st-version">—</value></div>
                <div class="stat"><label>PID</label><value id="st-pid">—</value></div>
                <div class="stat"><label>端口</label><value id="st-port">—</value></div>
                <div class="stat"><label>数据目录</label><value id="st-cache" class="ellipsis">—</value></div>
                <div class="stat"><label>WebUI 地址</label><value id="st-uiurl" class="ellipsis">—</value></div>
              </div>
            </section>
          </div>
        </section>

        <!-- 安装 -->
        <section class="cbm-panel" data-panel="install">
          <div class="cbm-grid">
            <section class="cbm-card span-2">
              <div class="cbm-card-head"><h2>安装 / 卸载</h2></div>
              <div class="cbm-field">
                <label>版本类型</label>
                <div class="cbm-seg" id="seg-variant" role="tablist">
                  <button class="seg-item active" data-value="ui">UI 版</button>
                  <button class="seg-item" data-value="standard">标准版</button>
                </div>
                <p class="cbm-hint">标准版为无界面的 MCP 服务；UI 版额外提供 3D 知识图谱可视化面板。</p>
              </div>
              <div class="cbm-field">
                <label>版本号</label>
                <div class="cbm-input-row">
                  <select id="in-version" class="cbm-select">
                    <option value="latest">latest（最新稳定版）</option>
                  </select>
                  <button class="cbm-btn ghost mini" id="btn-reload-versions" title="重新获取版本列表">↻</button>
                </div>
                <p class="cbm-hint" id="version-hint">已安装：—</p>
              </div>
              <div class="cbm-field">
                <label>下载镜像</label>
                <div class="cbm-input-row">
                  <input type="text" id="in-mirror" placeholder="https://gh-proxy.com/" />
                </div>
                <p class="cbm-hint">用于加速 GitHub Release 下载。留空则直连 GitHub。</p>
              </div>
              <div class="cbm-progress hidden" id="install-progress">
                <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
                <span id="progress-text">准备中…</span>
              </div>
              <div class="cbm-row">
                <button class="cbm-btn primary" id="btn-install">安装</button>
                <button class="cbm-btn hidden" id="btn-reinstall">重新安装 / 更新</button>
                <button class="cbm-btn danger hidden" id="btn-uninstall">卸载</button>
              </div>
              <p class="cbm-hint" id="install-hint"></p>
            </section>
          </div>
        </section>

        <!-- MCP 接入 -->
        <section class="cbm-panel" data-panel="mcp">
          <div class="cbm-grid">
            <section class="cbm-card span-2">
              <div class="cbm-card-head">
                <h2>接入 AstrBot MCP</h2>
                <div class="cbm-log-actions">
                  <button class="cbm-btn ghost mini" id="btn-mcp-copy">复制</button>
                  <button class="cbm-btn primary mini" id="btn-mcp-add">添加到 AstrBot</button>
                </div>
              </div>
              <pre class="cbm-log cbm-mcp" id="mcp-snippet">尚未加载配置。</pre>
              <p class="cbm-hint" id="mcp-status">将 CBM 作为 stdio MCP 服务写入 AstrBot 的 mcp_server.json；添加后可在「插件 → MCP」中查看，必要时重启生效。</p>
            </section>
          </div>
        </section>

        <!-- 日志 -->
        <section class="cbm-panel" data-panel="logs">
          <div class="cbm-grid">
            <section class="cbm-card span-2">
              <div class="cbm-card-head">
                <h2>运行日志</h2>
                <div class="cbm-log-actions">
                  <label class="cbm-check"><input type="checkbox" id="auto-logs" checked /><span>自动刷新</span></label>
                  <button class="cbm-btn ghost mini" id="btn-load-logs">刷新</button>
                </div>
              </div>
              <pre class="cbm-log" id="log-box">尚未加载日志。</pre>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div class="cbm-modal-mask hidden" id="modal-mask">
      <div class="cbm-modal" role="dialog" aria-modal="true">
        <h3 id="modal-title">确认</h3>
        <p id="modal-body"></p>
        <label class="cbm-modal-check hidden" id="modal-check-wrap">
          <input type="checkbox" id="modal-check" /><span id="modal-check-label"></span>
        </label>
        <div class="cbm-modal-actions">
          <button class="cbm-btn ghost" id="modal-cancel">取消</button>
          <button class="cbm-btn danger" id="modal-ok">确定</button>
        </div>
      </div>
    </div>

    <div class="cbm-toast-wrap" id="toasts"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
